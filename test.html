<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List (core functions)</title>
    <style>
        /* minimal essential styles only */
        textarea {
            width: 100%;
        }
        li {
            font-size: 30px;
        }
        .cat-1 { color: red; }      /* category 1: red text */
        .cat-2 { color: black; }    /* category 2: black text */
        .cat-3 { color: grey; }     /* category 3: grey text */
        .completed-task {
            text-decoration: line-through;
        }
        .hide-completed .completed-task {
            display: none;
        }
    </style>
</head>
<body>
    <textarea id='text' rows="3">Lecture preparation: cloud computing, 1; Dinner with Prof. Wong, 2; Walk my dog, 3; Lecture preparation: probability, 1</textarea> 
    <br/>
    <div class='divButton'>
        <button id='btn_add'>Add</button>
        <button id='btn_hide'>Toggle</button>
    </div>

    <ol id='order_list'>
    </ol>	

    <script>
        (function() {
            const textarea = document.getElementById('text');
            const addButton = document.getElementById('btn_add');
            const toggleButton = document.getElementById('btn_hide');
            const orderList = document.getElementById('order_list');

            // helper: get CSS class based on category
            function getCategoryClass(category) {
                const cat = String(category).trim();
                if (cat === '1') return 'cat-1';
                if (cat === '2') return 'cat-2';
                if (cat === '3') return 'cat-3';
                return 'cat-2'; // fallback
            }

            // parse input string into array of { content, category }
            function parseTasks(inputStr) {
                if (!inputStr) return [];
                const items = inputStr.split(';').filter(s => s.trim() !== '');
                const tasks = [];
                for (let item of items) {
                    const lastComma = item.lastIndexOf(',');
                    if (lastComma === -1) continue;
                    const content = item.substring(0, lastComma).trim();
                    const category = item.substring(lastComma + 1).trim();
                    if (content === '' || category === '') continue;
                    tasks.push({ content, category });
                }
                return tasks;
            }

            // create and add a single task <li> to the list
            function addTaskElement(content, category) {
                const li = document.createElement('li');
                li.textContent = content;
                li.classList.add(getCategoryClass(category));
                li.dataset.completed = 'false';

                // single click: toggle completed (strikethrough)
                li.addEventListener('click', function(e) {
                    // ignore if this is part of a double-click
                    if (e.detail === 2) return;
                    
                    if (li.dataset.completed === 'true') {
                        li.classList.remove('completed-task');
                        li.dataset.completed = 'false';
                    } else {
                        li.classList.add('completed-task');
                        li.dataset.completed = 'true';
                    }
                });

                // double click: delete with confirm
                li.addEventListener('dblclick', function(e) {
                    e.stopPropagation();
                    if (confirm(`Delete "${content}"?`)) {
                        li.remove();
                    }
                });

                orderList.appendChild(li);
            }

            // initial render from textarea default value
            function renderInitial() {
                orderList.innerHTML = '';
                const tasks = parseTasks(textarea.value);
                tasks.forEach(t => addTaskElement(t.content, t.category));
            }

            // add button: parse textarea and append new tasks (keep existing)
            function addTasks() {
                const tasks = parseTasks(textarea.value);
                tasks.forEach(t => addTaskElement(t.content, t.category));
            }

            // toggle completed visibility
            function toggleHide() {
                orderList.classList.toggle('hide-completed');
            }

            // attach event listeners
            addButton.addEventListener('click', addTasks);
            toggleButton.addEventListener('click', toggleHide);

            // start with demo tasks
            renderInitial();
        })();
    </script>
</body>
</html>
